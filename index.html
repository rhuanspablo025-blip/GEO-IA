        // Gemini REST API Wrapper
        const aiGenerateContent = async (requestBody) => {
            let apiKey = localStorage.getItem('GEMINI_API_KEY');
            if (!apiKey) {
                apiKey = prompt("Por favor, informe sua chave API do Google Gemini para utilizar as funções de IA:");
                if (apiKey) {
                    localStorage.setItem('GEMINI_API_KEY', apiKey);
                } else {
                    throw new Error("API Key não fornecida. A funcionalidade de IA foi cancelada.");
                }
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) {
                const err = await response.json();
                if(response.status === 400 && err?.error?.message?.includes('API key')) {
                    localStorage.removeItem('GEMINI_API_KEY');
                    throw new Error("Chave API inválida! Foi removida. Tente novamente.");
                }
                throw new Error(err?.error?.message || "Erro na geração com IA");
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        };

                    try {
                        unsubscribe = onSnapshot(query(collection(db, 'students'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)), snap => {

                        teacherId: user.uid,

        const GradebookView = ({ classes, user }) => {
            const [selectedClassId, setSelectedClassId] = useState('');
            const [students, setStudents] = useState([]);
            const [periods, setPeriods] = useState([]);
            const [selectedPeriodId, setSelectedPeriodId] = useState('');
            
            const [isManagingPeriods, setIsManagingPeriods] = useState(false);
            const [newPeriodName, setNewPeriodName] = useState('');
            const [newPeriodStart, setNewPeriodStart] = useState('');
            const [newPeriodEnd, setNewPeriodEnd] = useState('');

            const [assessments] = useState(['P1', 'P2', 'Trab']);

            useEffect(() => {
                if (selectedClassId && user) {
                    const unsubStudents = onSnapshot(query(collection(db, 'students'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)), snap => {
                        setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    const unsubPeriods = onSnapshot(query(collection(db, 'periods'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)), snap => {
                        setPeriods(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                    });
                    return () => {
                        unsubStudents();
                        unsubPeriods();
                    };
                } else {
                    setStudents([]);
                    setPeriods([]);
                }
            }, [selectedClassId, user]);

            useEffect(() => {
                if (periods.length > 0 && !periods.find(p => p.id === selectedPeriodId)) {
                    setSelectedPeriodId(periods[0].id);
                }
            }, [periods, selectedPeriodId]);

            const updateGrade = async (studentId, assessment, value) => {
                if (!selectedPeriodId) return alert("Selecione um período primeiro.");
                const student = students.find(s => s.id === studentId);
                const periodKey = `${selectedPeriodId}_${assessment}`;
                const grades = { ...(student.grades || {}), [periodKey]: value };
                await updateDoc(doc(db, 'students', studentId), { grades });
            };

            const addPeriod = async () => {
                if (!newPeriodName || !newPeriodStart || !newPeriodEnd || !selectedClassId || !user) return;
                try {
                    await addDoc(collection(db, 'periods'), {
                        name: newPeriodName,
                        classId: selectedClassId,
                        teacherId: user.uid,
                        startDate: newPeriodStart,
                        endDate: newPeriodEnd,
                        createdAt: new Date().toISOString()
                    });
                    setNewPeriodName('');
                    setNewPeriodStart('');
                    setNewPeriodEnd('');
                } catch (e) {

            const generateActivity = async () => {
                if (!topic) return alert("Digite um tema.");

                setIsGenerating(true);
                try {
                    const textResult = await aiGenerateContent({
                        contents: [{
                            parts: [{
                                text: `Crie uma atividade de Geografia para o ensino fundamental/médio sobre o tema: "${topic}". 
                                Inclua 2 questões dissertativas e 3 de múltipla escolha com gabarito. 
                                Formate lindamente em HTML, usando tags como <h1>, <h2>, <p>, <ul>, <li>, <strong>, etc. Não use Markdown, use apenas tags HTML puras para a formatação para facilitar a exportação.`
                            }]
                        }]
                    });
                    
                    // Cleanup possible markdown code block
                    let cleanedData = textResult || '';
                    if (cleanedData.startsWith('```html')) cleanedData = cleanedData.replace('```html\n', '');
                    if (cleanedData.endsWith('```')) cleanedData = cleanedData.slice(0, -3);

                    setGeneratedContent(cleanedData);

            const exportToWord = () => {
                const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Atividade GeoGrade</title></head><body>";
                const footer = "</body></html>";
                const sourceHTML = header + `<div style=\"font-family: Arial, sans-serif; line-height: 1.6; color: #333;\">${generatedContent}</div>` + footer;
                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload);
                fileDownload.href = source;

                                            <div className="w-16 h-16 bg-gradient-to-br from-amber-100 to-amber-50 rounded-[20px] flex items-center justify-center text-amber-600 mb-8 group-hover:scale-110 group-hover:rotate-3 transition-transform duration-500 shadow-sm border border-amber-100"><Icons.BookOpen /></div>
                                            <p className="text-slate-500 text-[11px] font-bold uppercase tracking-widest mb-2">Avaliações</p>
                                            <h3 className="text-5xl font-bold font-heading text-slate-900 tracking-tight">Ativo</h3>
                                        </div>
                                        <div className="bg-white/60 backdrop-blur-xl p-8 rounded-[32px] border border-white neo-shadow cursor-default animate-fade-stagger-3 group">
                                            <div className="w-16 h-16 bg-gradient-to-br from-purple-100 to-purple-50 rounded-[20px] flex items-center justify-center text-purple-600 mb-8 shadow-sm border border-purple-100"><Icons.TrendingUp /></div>
                                            <p className="text-slate-500 text-[11px] font-bold uppercase tracking-widest mb-2">Eficiência Global</p>
                                            <h3 className="text-5xl font-bold font-mono text-slate-900 tracking-tight">+85<span className="text-3xl text-slate-400 font-sans">%</span></h3>
                                        </div>
                                    </div>

                                    <div className="bg-white/80 backdrop-blur-xl rounded-[40px] border border-white neo-shadow overflow-hidden animate-fade-stagger-2">
                                        <div className="p-10 border-b border-slate-100/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <h4 className="font-bold text-slate-900 text-2xl font-heading">Turmas Recentes</h4>
                                            <div className="text-[11px] font-bold text-slate-500 uppercase tracking-widest bg-white px-5 py-2.5 rounded-full border border-slate-200/60 shadow-sm">{classes.length} Turmas Encontradas</div>
                                        </div>
                                        <div className="divide-y divide-slate-100/50">
                                            {classes.map((cls, idx) => (
                                                <div key={cls.id} className="p-8 px-10 flex flex-col sm:flex-row sm:items-center justify-between hover:bg-white transition-all duration-300 group" style={{ animationDelay: `${idx * 50}ms` }}>
                                                    <div className="flex items-center gap-6 mb-4 sm:mb-0">
                                                        <div className="w-16 h-16 bg-slate-900 rounded-[20px] flex items-center justify-center font-bold text-2xl text-white shadow-xl shadow-slate-900/15 group-hover:scale-105 group-hover:rotate-3 transition-all duration-500 font-heading">{cls.name[0]}</div>
                                                        <div>
                                                            <div className="font-bold text-xl text-slate-900 tracking-tight font-heading">{cls.name}</div>
                                                            <div className="text-[11px] text-slate-500 font-bold uppercase tracking-widest mt-1.5 flex items-center gap-2">
                                                                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                                                Ativa • Criada em {new Date(cls.createdAt).toLocaleDateString()}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-3">
                                                        <button onClick={() => { setActiveTab('students'); }} className="p-3.5 bg-white border border-slate-200/60 shadow-sm text-slate-400 hover:text-slate-900 hover:border-slate-300 hover:shadow-md rounded-[16px] transition-all hover:-translate-y-1">
                                                            <Icons.Users />
                                                        </button>
                                                        <button onClick={() => handleDelete(cls.id)} className="p-3.5 bg-white border border-slate-200/60 shadow-sm text-slate-400 hover:text-red-500 hover:border-red-200 hover:bg-red-50 hover:shadow-md rounded-[16px] transition-all hover:-translate-y-1">
                                                            <Icons.Trash2 />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            {classes.length === 0 && (
                                                <div className="p-24 text-center">
                                                    <div className="w-24 h-24 bg-gradient-to-br from-slate-100 to-white rounded-[32px] flex items-center justify-center mx-auto mb-8 border-2 border-dashed border-slate-200 shadow-sm opacity-75 animate-pulse">
                                                        <Icons.Users className="w-10 h-10 text-slate-300" />
                                                    </div>
                                                    <h3 className="text-2xl font-bold font-heading text-slate-900 mb-2">Sua jornada começa aqui</h3>
                                                    <p className="text-slate-500 font-medium text-[15px] mb-8 max-w-sm mx-auto">Adicione sua primeira turma para começar a organizar alunos e utilizar o poder da inteligência artificial.</p>
                                                    <button onClick={() => setIsModalOpen(true)} className="bg-slate-900 text-white px-8 py-4 rounded-[20px] font-bold text-[13px] uppercase tracking-widest hover:bg-slate-800 transition-all hover:-translate-y-1 hover:shadow-xl shadow-slate-900/20 active:translate-y-0 relative overflow-hidden group inline-flex mx-auto border border-slate-800">
                                                        <div className="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
                                                        <span className="relative z-10 flex items-center gap-3">
                                                            <Icons.Plus className="w-5 h-5"/> Criar Primeira Turma
                                                        </span>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ) : activeTab === 'corrector' ? (
                                <CorrectorView classes={classes} user={user} />
                            ) : activeTab === 'generator' ? (
                                <GeneratorView classes={classes} />
                            ) : activeTab === 'students' ? (
                                <StudentsView classes={classes} user={user} />
                            ) : activeTab === 'gradebook' ? (
                                <GradebookView classes={classes} user={user} />
                            ) : null}
                        </div>
                    </main>

                    {/* Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md flex items-center justify-center p-6 z-[200] animate-fade-in">
                            <div className="bg-white/90 backdrop-blur-2xl p-10 rounded-[40px] shadow-2xl w-full max-w-md space-y-8 animate-fade-in border border-white">
                                <div className="text-center">
                                    <div className="w-16 h-16 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-800 mx-auto mb-6 shadow-sm"><Icons.Plus /></div>
                                    <h3 className="text-3xl font-bold text-slate-900 tracking-tight font-heading">Nova Turma</h3>
                                    <p className="text-slate-500 font-medium text-[15px] mt-2">Organize seus alunos por disciplinas e turmas</p>
                                </div>
                                <div className="space-y-6">
                                    <input 
                                        className="w-full p-5 bg-white border border-slate-200 rounded-[24px] outline-none focus:ring-4 focus:ring-slate-900/10 focus:border-slate-900 transition-all font-semibold text-slate-800 text-lg text-center shadow-sm" 
                                        placeholder="Ex: 9º Ano A - Vespertino" 
                                        value={classNameInput} 
                                        onChange={e => setClassNameInput(e.target.value)} 
                                        autoFocus
                                    />
                                    <div className="flex gap-4">
                                        <button onClick={() => setIsModalOpen(false)} className="flex-1 p-5 font-bold text-slate-500 hover:text-slate-800 hover:bg-slate-100 rounded-[24px] transition-all">Cancelar</button>
                                        <button onClick={handleCreateClass} className="flex-1 bg-slate-900 text-white p-5 rounded-[24px] font-bold text-lg shadow-xl shadow-slate-900/20 hover:-translate-y-1 active:translate-y-0 transition-all">Criar Turma</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        
        async function initApp() {
            try {
                const configRes = await fetch('/firebase-applet-config.json');
                const firebaseConfig = await configRes.json();
                
                const firebaseApp = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js");
                const firebaseAuth = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js");
                const firebaseFirestore = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js");
                
                const app = firebaseApp.initializeApp(firebaseConfig);
                db = firebaseFirestore.getFirestore(app, firebaseConfig.firestoreDatabaseId);
                auth = firebaseAuth.getAuth(app);
                
                onSnapshot = firebaseFirestore.onSnapshot;
                query = firebaseFirestore.query;
                collection = firebaseFirestore.collection;
                where = firebaseFirestore.where;
                addDoc = firebaseFirestore.addDoc;
                deleteDoc = firebaseFirestore.deleteDoc;
                doc = firebaseFirestore.doc;
                updateDoc = firebaseFirestore.updateDoc;
                
                onAuthStateChanged = firebaseAuth.onAuthStateChanged;
                signInWithPopup = firebaseAuth.signInWithPopup;
                signOut = firebaseAuth.signOut;
                GoogleAuthProvider = firebaseAuth.GoogleAuthProvider;

                root.render(<App />);
            } catch (err) {
                console.error("Failed to initialize app:", err);
                root.render(<div className="p-10 text-center text-red-500 font-bold">Erro ao inicializar Firebase.</div>);
            }
        }
        
        initApp();
    </script>
</body>
</html>
