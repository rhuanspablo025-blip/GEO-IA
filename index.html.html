            ),
            FileText: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
            ),
            FilePdf: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14.5 2 14.5 7.5 20 7.5"/></svg>
            ),
            MessageCircle: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            ),
            Download: () => (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            )
        };

        let db, auth;
        let onSnapshot, query, collection, where, addDoc, deleteDoc, doc, updateDoc;
        // ✅ CORRIGIDO: Usar redirect em vez de popup
        let onAuthStateChanged, signInWithRedirect, getRedirectResult, signOut, GoogleAuthProvider;

        const aiGenerateContent = async (requestBody) => {
            let apiKey = localStorage.getItem('GEMINI_API_KEY');
            if (!apiKey) {
                apiKey = prompt("Informe sua chave API do Google Gemini:");
                if (apiKey) {
                    localStorage.setItem('GEMINI_API_KEY', apiKey);
                } else {
                    throw new Error("API Key não fornecida.");
                }
            }
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            if (!response.ok) {
                const err = await response.json();
                if (response.status === 400 && err?.error?.message?.includes('API key')) {
                    localStorage.removeItem('GEMINI_API_KEY');
                    throw new Error("Chave API inválida! Tente novamente.");
                }
                throw new Error(err?.error?.message || "Erro na geração com IA");
            }
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        };

        const StudentsView = ({ classes, user }) => {
            const [selectedClassId, setSelectedClassId] = useState('');
            const [students, setStudents] = useState([]);
            const [newStudentName, setNewStudentName] = useState('');
            const [editingStudentId, setEditingStudentId] = useState(null);
            const [editName, setEditName] = useState('');

            useEffect(() => {
                let unsubscribe = () => {};
                if (selectedClassId && user) {
                    try {
                        unsubscribe = onSnapshot(
                            query(collection(db, 'students'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)),
                            snap => setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                            err => console.error("Erro Snapshot Alunos:", err)
                        );
                    } catch (e) { console.error(e); }
                } else {
                    setStudents([]);
                }
                return () => unsubscribe();
            }, [selectedClassId, user]);

            const addStudent = async () => {
                if (!newStudentName.trim() || !selectedClassId || !user) return;
                try {
                    await addDoc(collection(db, 'students'), {
                        name: newStudentName, classId: selectedClassId, teacherId: user.uid, grades: {}, createdAt: new Date().toISOString()
                    });
                    setNewStudentName('');
                } catch (e) { console.error(e); }
            };

            const removeStudent = async (id) => {
                try { await deleteDoc(doc(db, 'students', id)); } catch (e) { console.error(e); }
            };

            const saveEdit = async (id) => {
                if (editName.trim()) {
                    try { await updateDoc(doc(db, 'students', id), { name: editName.trim() }); setEditingStudentId(null); } catch (e) { console.error(e); }
                }
            };

            return (
                <div className="space-y-6 animate-fade-in max-w-4xl mx-auto">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[40px] border border-white neo-shadow space-y-8">
                        <div className="flex items-center gap-4 pb-4 border-b border-slate-100/50">
                            <div className="w-12 h-12 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-[16px] flex items-center justify-center text-white shadow-lg"><Icons.Users /></div>
                            <h3 className="text-2xl font-bold font-heading text-slate-900 tracking-tight">Gestão de Alunos</h3>
                        </div>
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 bg-slate-50/50 p-6 rounded-[24px] border border-slate-100/50">
                            <div className="flex-1">
                                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Selecionar Turma</label>
                                <select className="w-full p-4 bg-white border border-slate-200 rounded-xl outline-none focus:border-slate-800 transition-all font-medium text-slate-700" value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)}>
                                    <option value="">Selecione uma turma...</option>
                                    {classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                </select>
                            </div>
                            <div className="flex-1">
                                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Adicionar Aluno</label>
                                <div className="flex gap-2">
                                    <input className="flex-1 p-4 bg-white border border-slate-200 rounded-xl outline-none focus:border-slate-800 transition-all font-medium text-slate-700" placeholder="Nome do aluno" value={newStudentName} onChange={e => setNewStudentName(e.target.value)} onKeyPress={e => e.key === 'Enter' && addStudent()} />
                                    <button onClick={addStudent} className="bg-slate-900 text-white p-4 rounded-xl hover:bg-slate-800 transition-all shadow-md"><Icons.Plus /></button>
                                </div>
                            </div>
                        </div>
                        {selectedClassId && (
                            <div className="overflow-hidden border border-slate-100/50 rounded-[32px] shadow-sm bg-white/50">
                                <table className="w-full text-left">
                                    <thead className="bg-white/60 border-b border-slate-100/50">
                                        <tr>
                                            <th className="px-8 py-6 text-[11px] font-bold uppercase tracking-widest text-slate-400">Aluno</th>
                                            <th className="px-8 py-6 text-[11px] font-bold uppercase tracking-widest text-right text-slate-400">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100/50">
                                        {students.map(s => (
                                            <tr key={s.id} className="hover:bg-white transition-all group">
                                                <td className="px-8 py-5">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-100 to-teal-100 text-emerald-600 flex items-center justify-center font-bold text-sm">{s.name.charAt(0).toUpperCase()}</div>
                                                        {editingStudentId === s.id ? (
                                                            <input autoFocus type="text" value={editName} onChange={e => setEditName(e.target.value)} className="border border-slate-200 rounded-xl px-4 py-2 outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 max-w-xs transition-all" onKeyPress={e => e.key === 'Enter' && saveEdit(s.id)} />
                                                        ) : (
                                                            <span className="font-bold text-[15px] text-slate-800 font-heading">{s.name}</span>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="px-8 py-5 text-right">
                                                    <div className="flex justify-end gap-3">
                                                        {editingStudentId === s.id ? (
                                                            <>
                                                                <button onClick={() => saveEdit(s.id)} className="text-emerald-600 hover:text-white bg-emerald-50 hover:bg-emerald-500 px-4 py-2 rounded-[16px] transition-all text-[11px] font-bold uppercase tracking-widest border border-emerald-200/60">Salvar</button>
                                                                <button onClick={() => setEditingStudentId(null)} className="text-slate-500 bg-white px-4 py-2 rounded-[16px] border border-slate-200/60 transition-all text-[11px] font-bold uppercase tracking-widest">Cancelar</button>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <button onClick={() => { setEditingStudentId(s.id); setEditName(s.name); }} className="text-slate-400 bg-white border border-slate-100 p-3 rounded-[16px] hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50 transition-all opacity-0 group-hover:opacity-100"><div className="w-4 h-4"><Icons.Edit /></div></button>
                                                                <button onClick={() => removeStudent(s.id)} className="text-slate-400 bg-white border border-slate-100 p-3 rounded-[16px] hover:text-red-600 hover:border-red-200 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100"><div className="w-4 h-4"><Icons.Trash2 /></div></button>
                                                            </>
                                                        )}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                        {students.length === 0 && (
                                            <tr><td colSpan="2" className="px-8 py-16 text-center text-slate-400 font-medium">Nenhum aluno. Adicione acima.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const GradebookView = ({ classes, user }) => {
            const [selectedClassId, setSelectedClassId] = useState('');
            const [students, setStudents] = useState([]);
            const [periods, setPeriods] = useState([]);
            const [selectedPeriodId, setSelectedPeriodId] = useState('');
            const [isManagingPeriods, setIsManagingPeriods] = useState(false);
            const [newPeriodName, setNewPeriodName] = useState('');
            const [newPeriodStart, setNewPeriodStart] = useState('');
            const [newPeriodEnd, setNewPeriodEnd] = useState('');
            const assessments = ['P1', 'P2', 'Trab'];

            useEffect(() => {
                if (selectedClassId && user) {
                    const unsubStudents = onSnapshot(query(collection(db, 'students'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)), snap => setStudents(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    const unsubPeriods = onSnapshot(query(collection(db, 'periods'), where('classId', '==', selectedClassId), where('teacherId', '==', user.uid)), snap => setPeriods(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                    return () => { unsubStudents(); unsubPeriods(); };
                } else { setStudents([]); setPeriods([]); }
            }, [selectedClassId, user]);

            useEffect(() => {
                if (periods.length > 0 && !periods.find(p => p.id === selectedPeriodId)) setSelectedPeriodId(periods[0].id);
            }, [periods, selectedPeriodId]);

            const updateGrade = async (studentId, assessment, value) => {
                if (!selectedPeriodId) return alert("Selecione um período.");
                const student = students.find(s => s.id === studentId);
                const grades = { ...(student.grades || {}), [`${selectedPeriodId}_${assessment}`]: value };
                await updateDoc(doc(db, 'students', studentId), { grades });
            };

            const addPeriod = async () => {
                if (!newPeriodName || !newPeriodStart || !newPeriodEnd || !selectedClassId || !user) return;
                try {
                    await addDoc(collection(db, 'periods'), { name: newPeriodName, classId: selectedClassId, teacherId: user.uid, startDate: newPeriodStart, endDate: newPeriodEnd, createdAt: new Date().toISOString() });
                    setNewPeriodName(''); setNewPeriodStart(''); setNewPeriodEnd('');
                } catch (e) { console.error(e); }
            };

            const removePeriod = async (id) => { try { await deleteDoc(doc(db, 'periods', id)); } catch (e) { console.error(e); } };

            return (
                <div className="space-y-8 animate-fade-in">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[40px] border border-white neo-shadow space-y-8 overflow-x-auto">
                        <div className="flex flex-col md:flex-row items-start lg:items-center justify-between gap-6 pb-6 border-b border-slate-100/50">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-orange-500 rounded-[16px] flex items-center justify-center text-white shadow-lg"><Icons.BookOpen /></div>
                                <h3 className="text-2xl font-bold font-heading text-slate-900 tracking-tight">Diário de Classe</h3>
                            </div>
                            <div className="flex flex-wrap gap-4">
                                <select className="p-4 bg-white border border-slate-200 rounded-[16px] outline-none focus:border-slate-800 transition-all text-sm font-medium text-slate-700 shadow-sm" value={selectedClassId} onChange={e => setSelectedClassId(e.target.value)}>

                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent("<html><head><meta charset='utf-8'></head><body>" + generatedContent + "</body></html>");
                const a = document.createElement("a"); document.body.appendChild(a); a.href = source; a.download = 'atividade_geograde.doc'; a.click(); document.body.removeChild(a);
            };

        const App = () => {

                    if (result?.user) {
                        setUser(result.user);
                    }
                }).catch(err => {

                });

                const unsubscribeAuth = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });

                return () => unsubscribeAuth();

            useEffect(() => {
                let unsubscribeClasses = () => {};

                    unsubscribeClasses = onSnapshot(
                        query(collection(db, 'classes'), where('teacherId', '==', user.uid)),
                        s => setClasses(s.docs.map(d => ({ id: d.id, ...d.data() })))
                    );

                return () => unsubscribeClasses();
            }, [user]);

            // ✅ CORRIGIDO: usar signInWithRedirect em vez de signInWithPopup
            const loginWithGoogle = async () => {
                try {
                    setLoginLoading(true);
                    const provider = new GoogleAuthProvider();
                    await signInWithRedirect(auth, provider);
                    // A página será redirecionada — o resultado é capturado no useEffect acima
                } catch (err) {
                    console.error("Erro ao redirecionar:", err);
                    setLoginLoading(false);
                }
            };

            const logout = () => signOut(auth);

            const handleCreateClass = async () => {
                if (!classNameInput.trim() || !user) return;
                try {
                    await addDoc(collection(db, 'classes'), { name: classNameInput, teacherId: user.uid, createdAt: new Date().toISOString() });
                    setIsModalOpen(false); setClassNameInput('');
                } catch (e) { alert("Erro ao criar turma."); }
            };

            const handleDelete = async (id) => {
                if (window.confirm("Excluir turma?")) await deleteDoc(doc(db, 'classes', id));
